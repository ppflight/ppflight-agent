name: Release PPFlight Agent

on:
  push:
    branches:
      - 'main'
      - 'agent-v1-rc'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to package, optionally X.Y.Z-rc.N (manual dispatch never publishes)
        required: true
        type: string

# A stable tag build creates an immutable GitHub Release.  Integration branch
# pushes and manual dispatch only package and retain Actions artifacts; they never publish.
permissions:
  contents: read

jobs:
  verify:
    name: verify race and vet
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Race detector and static analysis
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py'
          go test -race -count=1 ./...
          go vet ./...

  package:
    name: package (${{ matrix.arch }})
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          repository_version="$(tr -d '[:space:]' < VERSION)"
          [[ "$repository_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo 'VERSION must be X.Y.Z or X.Y.Z-rc.N' >&2; exit 1; }
          if [[ "${{ github.ref_type }}" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "v${version}" == "$GITHUB_REF_NAME" ]] || { echo 'tag must start with v' >&2; exit 1; }
            [[ "$version" == "$repository_version" ]] || { echo "tag version $version must exactly match VERSION $repository_version" >&2; exit 1; }
          elif [[ "${{ github.event_name }}" == push ]]; then
            version="$repository_version"
          else
            version="${{ inputs.version }}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo 'version must be X.Y.Z or X.Y.Z-rc.N' >&2; exit 1; }
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Test release packaging policy
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/package-release.sh scripts/package-release_test.sh scripts/quick-install.sh
          go test ./...
          bash scripts/package-release_test.sh
      - name: Build static Linux binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist/release
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.version.outputs.value }}" -o dist/ppflight-agent ./cmd/ppflight-agent
          scripts/package-release.sh --binary dist/ppflight-agent --version "${{ steps.version.outputs.value }}" --arch "${{ matrix.arch }}" --output-dir dist/release
          mv dist/release/SHA256SUMS "dist/release/SHA256SUMS-${{ matrix.arch }}"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: ppflight-release-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/release/

  publish:
    name: publish GitHub release
    needs: package
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: ppflight-release-*
          path: release
          merge-multiple: true
      - name: Combine checksums and publish immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd release
          cat SHA256SUMS-amd64 SHA256SUMS-arm64 > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "$TAG" \
            ppflight-agent-*-linux-*.tar.gz SHA256SUMS \
            --verify-tag \
            --prerelease \
            --title "PPFlight Agent $TAG" \
            --generate-notes

  publish-rolling-main:
    name: publish rolling main assets
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: ppflight-release-*
          path: release
          merge-multiple: true
      - name: Publish one force-updated integration snapshot without a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd release
          cat SHA256SUMS-amd64 SHA256SUMS-arm64 > SHA256SUMS.source
          sha256sum --check SHA256SUMS.source
          amd64_source="$(find . -maxdepth 1 -type f -name 'ppflight-agent-*-linux-amd64.tar.gz' -print)"
          arm64_source="$(find . -maxdepth 1 -type f -name 'ppflight-agent-*-linux-arm64.tar.gz' -print)"
          [[ $(printf '%s\n' "$amd64_source" | grep -c .) -eq 1 && $(printf '%s\n' "$arm64_source" | grep -c .) -eq 1 ]]
          mkdir rolling
          cp -- "$amd64_source" rolling/ppflight-agent-main-linux-amd64.tar.gz
          cp -- "$arm64_source" rolling/ppflight-agent-main-linux-arm64.tar.gz
          cd rolling
          sha256sum ppflight-agent-main-linux-amd64.tar.gz ppflight-agent-main-linux-arm64.tar.gz > SHA256SUMS
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          repository = os.environ['REPOSITORY']
          commit = os.environ['SOURCE_COMMIT']
          artifacts = []
          for arch in ('amd64', 'arm64'):
              name = f'ppflight-agent-main-linux-{arch}.tar.gz'
              raw = Path(name).read_bytes()
              artifacts.append({
                  'arch': arch,
                  'name': name,
                  'url': f'https://raw.githubusercontent.com/{repository}/rolling-main/{name}',
                  'size': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(),
              })
          manifest = {
              'schemaVersion': 1,
              'channel': 'main',
              'sourceCommitSha': commit,
              'artifacts': artifacts,
          }
          Path('manifest.json').write_text(json.dumps(manifest, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          touch .nojekyll
          git init --initial-branch=rolling-main
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .nojekyll SHA256SUMS manifest.json ppflight-agent-main-linux-*.tar.gz
          git commit -m "Rolling main ${SOURCE_COMMIT}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" HEAD:refs/heads/rolling-main
