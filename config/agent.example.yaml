{
  "schemaVersion": 1,
  "mode": "production",
  "identity": {
    "agentRef": "agent-example-01",
    "collectorRef": "collector-example-01",
    "sourceRef": "pve-agent-v1",
    "clusterRef": "cluster-example-01",
    "nodeRef": "auto",
    "site": "primary"
  },
  "runtime": {
    "stateDirectory": "/var/lib/ppflight-agent",
    "listenAddress": "127.0.0.1:9745",
    "shutdownGrace": "15s",
    "logLevel": "info"
  },
  "collection": {
    "sampleInterval": "10s",
    "monitoringInterval": "1m",
    "meteringInterval": "1m",
    "inventoryInterval": "5m",
    "guestInterval": "2m",
    "smartInterval": "5m",
    "requestConcurrency": 8,
    "guestRequestConcurrency": 4
  },
  "pve": {
    "source": "disabled",
    "endpoint": "https://127.0.0.1:8006",
    "tlsServerName": "pve01.example.invalid",
    "tokenIdEnv": "PVE_READ_TOKEN_ID",
    "tokenSecretEnv": "PVE_READ_TOKEN_SECRET",
    "caFile": "/etc/ppflight-agent/pve-root-ca.pem",
    "insecureSkipTls": false,
    "timeout": "10s",
    "maxResponseBytes": 8388608,
    "localNode": "auto",
    "collectClusterWide": false
  },
  "exporters": {
    "node": {
      "enabled": false,
      "url": "http://127.0.0.1:9100/metrics",
      "timeout": "5s",
      "maxResponseBytes": 16777216
    },
    "smart": {
      "enabled": false,
      "url": "http://127.0.0.1:9633/metrics",
      "timeout": "15s",
      "maxResponseBytes": 33554432
    }
  },
  "assignments": {
    "file": "/var/lib/ppflight-agent/assignments/assignments.json",
    "refreshUrl": "",
    "refreshInterval": "5m"
  },
  "destinations": {
    "websiteMetering": {
      "enabled": false,
      "url": "",
      "auth": { "mode": "none" },
      "timeout": "15s",
      "maxResponseBytes": 2097152,
      "maxCompressedBytes": 67108864,
      "maxUncompressedBytes": 268435456,
      "maxQueueBytes": 67108864,
      "compression": "none",
      "payloadFormat": "usage-v1"
    },
    "websiteTelemetry": {
      "enabled": false,
      "url": "",
      "auth": { "mode": "none" },
      "timeout": "15s",
      "maxResponseBytes": 2097152,
      "maxCompressedBytes": 67108864,
      "maxUncompressedBytes": 268435456,
      "maxQueueBytes": 268435456,
      "compression": "none",
      "payloadFormat": "telemetry-v1"
    },
    "monitoring": {
      "enabled": false,
      "url": "",
      "auth": { "mode": "none" },
      "timeout": "15s",
      "maxResponseBytes": 2097152,
      "maxCompressedBytes": 67108864,
      "maxUncompressedBytes": 268435456,
      "maxQueueBytes": 536870912,
      "compression": "none",
      "payloadFormat": "telemetry-v1"
    },
    "monitoringAudit": {
      "enabled": false,
      "url": "",
      "auth": { "mode": "none" },
      "timeout": "15s",
      "maxResponseBytes": 2097152,
      "maxCompressedBytes": 4194304,
      "maxUncompressedBytes": 16777216,
      "maxQueueBytes": 536870912,
      "compression": "none",
      "payloadFormat": "audit-v1"
    }
  },
  "control": {
    "enabled": false,
    "pollUrl": "",
    "resultUrl": "",
    "auth": { "mode": "hmac-sha256", "keyIdEnv": "", "secretEnv": "" },
    "pollInterval": "5s",
    "longPollWait": "25s",
    "requestTimeout": "30s",
    "commandSecretEnv": "",
    "commandSigningKeyIdEnv": "",
    "commandPublicKeyEnv": "",
    "pveTokenIdEnv": "PVE_CONTROL_TOKEN_ID",
    "pveTokenSecretEnv": "PVE_CONTROL_TOKEN_SECRET",
    "maxCommandsPerPoll": 1,
    "maxActiveConsoleSessions": 8,
    "allowedActions": ["vm.start", "vm.shutdown", "vm.reboot"],
    "productionExecution": false
  }
}
