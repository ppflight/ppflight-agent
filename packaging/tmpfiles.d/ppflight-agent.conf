# PPFlight runtime state. The agent owns the general state root and assignment
# refresh directory; binding credentials remain root-owned and service-read-only.
d /var/lib/ppflight-agent 0750 ppflight-agent ppflight-agent -
d /var/lib/ppflight-agent/bindings 0750 root ppflight-agent -
z /var/lib/ppflight-agent/bindings/binding-state.json 0640 root ppflight-agent -
z /var/lib/ppflight-agent/bindings/monitoring-binding-state.json 0640 root ppflight-agent -
z /var/lib/ppflight-agent/bindings/device-id 0640 root ppflight-agent -
z /var/lib/ppflight-agent/bindings/.website-binding-pending.json 0640 root ppflight-agent -
z /var/lib/ppflight-agent/bindings/.monitoring-binding-pending.json 0640 root ppflight-agent -
d /var/lib/ppflight-agent/assignments 0750 ppflight-agent ppflight-agent -
z /var/lib/ppflight-agent/assignments/assignments.json 0640 ppflight-agent ppflight-agent -
d /var/lib/ppflight-agent/upgrades 0750 root ppflight-agent -
d /var/lib/ppflight-agent/upgrades/pending 0700 ppflight-agent ppflight-agent -
d /var/lib/ppflight-agent/upgrades/results 0700 ppflight-agent ppflight-agent -
d /var/lib/ppflight-agent/upgrades/backups 0700 root root -
